<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Le langage JSX</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
        <script src="https://unpkg.com/react@16/umd/react.development.js" crossorigin></script>
        <script src="https://unpkg.com/react-dom@16/umd/react-dom.development.js" crossorigin></script>
        <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
       
    </head>
    <body>
        <div id="root"></div>
    </body>
    <script type="text/babel">
        const products = [ 
  { 
    id: 1, 
    title: 'PC Portable Gamer HP VICTUS', 
    price: '7490 DH', 
    thumbnail : 'HP16D0195NF.jpg' 
  }, 
  { 
    id: 2, 
    title: 'PC Portable Gamer HP VICTUS', 
    price: '2190 DH', 
    thumbnail : 'HP14424U3EA.jpg' 
  }, 
  { 
    id: 3, 
    title: 'Pc Portable Chromebook Acer', 
    price: '3640 DH', 
    thumbnail: 'NXATHEF002.jpg' 
  }, 
  { 
    id: 4, 
    title: 'PC Portable - HUAWEI', 
    price: '1270 DH', 
    thumbnail: 'HUA6901443442959.jpg' 
  }, 
]; 

        function Product(props){
            return (
                <div className="col-md-6 col-lg-3 mb-4">
                    <div className="card shadow-sm h-100">
                        <img 
                            className="card-img-top" 
                            src={`pictures/${props.thumbnail}`}
                            
                        />
                        <div className="card-body d-flex flex-column">
                            <h5 className="card-title">{props.title}</h5>
                            <p className="card-text fw-bold text-primary">{props.price}</p>
                            <div className="mt-auto">
                                <div className="d-flex justify-content-between align-items-center">
                                    <div className="btn-group w-100">
                                        <button type="button" className="btn btn-sm btn-outline-primary">
                                            Ajouter au panier
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function Products() {
            return (
                <div className="container">
                    <h1 className="text-center mb-4">Ordinateurs Portables</h1>
                    <div className="row">
                        {products.map((product) => ( 
                            <Product 
                                key={product.id} 
                                title={product.title} 
                                price={product.price} 
                                thumbnail={product.thumbnail} 
                            /> 
                        ))}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<Products />, document.getElementById("root"));
    </script>
</html>
